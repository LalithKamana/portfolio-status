# Upptime configuration for Portfolio Tracker
# Docs: https://upptime.js.org/docs/configuration

owner: LalithKamana
repo: portfolio-status

# ── Sites to monitor ──────────────────────────────────────────────────────────
sites:
  - name: Portfolio Gateway
    url: https://portfolio-gateway.onrender.com/health
    # Render free tier takes up to 30s to cold-start; mark degraded (yellow)
    # only beyond 30s so we don't get false "slow" alerts on first wake-up
    maxResponseTime: 30000

  - name: Portfolio Data
    url: https://portfolio-data-tqlm.onrender.com/health
    maxResponseTime: 30000

# ── Schedule ──────────────────────────────────────────────────────────────────
# Ping every 20 min during 7:30 AM – 11:30 PM IST (02:00–17:59 UTC).
# 20-min interval: service awake 15 min, sleeps 5 min → 75% duty cycle.
# Estimated usage: 2 services × 16 hrs × 0.75 × 30 days ≈ 720 hrs/month (< 750).
# Maintenance window: 11:30 PM – 7:30 AM IST — no pings, services sleep freely.
workflowSchedule:
  uptime: "*/20 2-17 * * *"    # every 20 min, 02:00–17:59 UTC = 07:30 AM–11:29 PM IST
  graphs: "0 19 * * *"          # generate graphs at 00:30 IST (off-peak)
  responseTime: "0 19 * * *"    # response-time graph daily at 00:30 IST
  summary: "0 19 * * *"         # update README summary daily at 00:30 IST
  staticSite: "0 20 * * *"      # rebuild status page at 01:30 IST
  updateTemplate: "0 20 * * 0"  # check for Upptime template updates weekly

# ── Status page ───────────────────────────────────────────────────────────────
status-website:
  name: Portfolio Tracker Status
  introTitle: "Portfolio Tracker — Service Status"
  introMessage: "Live uptime for Portfolio Gateway and Portfolio Data services hosted on Render."
  theme: light
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/LalithKamana/portfolio-status

# ── Notifications ─────────────────────────────────────────────────────────────
# GitHub Issues are created automatically when a service goes down.
# The issue is closed automatically when the service recovers.
assignees:
  - LalithKamana

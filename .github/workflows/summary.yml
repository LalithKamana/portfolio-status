name: Summary CI
on:
  schedule:
    - cron: "0 19 * * *"    # daily at 19:00 UTC = 00:30 IST
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
jobs:
  release:
    name: Update summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update summary
        uses: upptime/uptime-monitor@v1.41.3
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
